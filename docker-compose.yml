services:
  db:
    image: pgvector/pgvector:pg16
    container_name: assistant-db
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: assistant-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 容器里只覆盖这三项；其余全部来自挂载进来的 config/app.yaml
      DATABASE_URL: postgresql://assistant:assistant@db:5432/assistant
      AGENT_BACKEND: ${AGENT_BACKEND:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data

  # 本地模型（可选）。有 GPU 或想完全离线时再开：
  # ollama:
  #   image: ollama/ollama:latest
  #   ports: ["11434:11434"]
  #   volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  # ollama:
