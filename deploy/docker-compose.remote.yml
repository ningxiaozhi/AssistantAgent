services:
  db:
    image: pgvector/pgvector:pg16
    container_name: assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 deploy/.env 里设置强密码}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时自动建表（卷为空才执行）
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # 只绑回环：远程访问请走 SSH 隧道，不要改成 0.0.0.0
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-assistant}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
